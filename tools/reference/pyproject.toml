[project]
name = "bg2cellml-reference"
description = "Generate reference results for the JavaScript bg2cellml from the Python bg2cellml."
version = "0.1.0"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    # The Python bg2cellml's own dependencies (BG-Tools v0.11.2 pyproject.toml).
    # bg2cellml itself is imported from a BG-Tools checkout: see generate.py.
    "lxml>=5.4.0",
    "networkx>=3.5",
    "pint>=0.24.4",
    "pyoxigraph>=0.5.2",
    "sympy>=1.14.0",
    "ucumvert>=0.2.2",
    # Simulation
    "libopencor==1.20260803.0",
]

[tool.uv]
package = false
